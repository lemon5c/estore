<form method="post" action="{% url 'accounts:profile' %}"
      id="profile-form"
      {% if request.htmx %}hx-post="{% url 'accounts:profile' %}" hx-target="#profile-form" hx-swap="outerHTML"{% endif %}>
  {% csrf_token %}

  {% if saved %}
  <div class="bg-green-50 border border-green-200 rounded-lg px-4 py-3 mb-4 text-sm text-green-700 flex items-center gap-2">
    ✓ Profile updated successfully!
  </div>
  {% endif %}

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Full Name</label>
      <input type="text" name="full_name"
             value="{{ form.full_name.value|default:'' }}"
             class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
      {% if form.full_name.errors %}
      <p class="text-red-600 text-xs mt-1">{{ form.full_name.errors.0 }}</p>
      {% endif %}
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">City</label>
      <input type="text" name="city"
             value="{{ form.city.value|default:'' }}"
             placeholder="e.g. Tripoli"
             class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
    </div>
  </div>

  <div class="mb-4">
    <label class="block text-sm font-medium text-gray-700 mb-1.5">Delivery Address</label>
    <textarea name="address" rows="3"
              placeholder="Street, building, apartment..."
              class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary resize-none">{{ form.address.value|default:'' }}</textarea>
  </div>

  <div class="mb-6">
    <label class="block text-sm font-medium text-gray-700 mb-2">Preferred OTP Channel</label>
    <div class="flex gap-3">
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" name="preferred_otp_channel" value="whatsapp"
               {% if form.preferred_otp_channel.value == 'whatsapp' %}checked{% endif %}
               class="accent-primary" />
        <span class="text-sm">💬 WhatsApp</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" name="preferred_otp_channel" value="sms"
               {% if form.preferred_otp_channel.value == 'sms' %}checked{% endif %}
               class="accent-primary" />
        <span class="text-sm">📲 SMS</span>
      </label>
    </div>
  </div>

  <button type="submit"
          class="w-full bg-primary hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl transition-colors text-sm">
    Save Changes
  </button>
</form>
